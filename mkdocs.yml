site_name: Alçadas
site_description: Sistema de Workflow de Alçadas de Aprovação e Rastreabilidade Operacional
site_author: Equipe Alçadas - UnB
repo_name: Alcadas/alcadas-docs
repo_url: https://github.com/Alcadas/alcadas-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Início: index.md
  - "Visão do Produto": 
        - "Cenário atual e Solução proposta" : visao-produto/visao-produto.md
        - "Personas do Usuário" : visao-produto/personas.md
        - "Cronograma da Equipe" : visao-produto/cronograma.md
  - Requisitos: requisitos.md
  - "Histórias de Usuários": historias-usuario.md
  - Arquitetura:
      - "Visão Geral": ARCHITECTURE.md
      - "Tabela de Transições": arquitetura/tabela-transicoes.md
      - "Decisões de Arquitetura (ADRs)":
          - "Catálogo de ADRs": arquitetura/adrs/index.md
          - "ADR-001: Monorepo com Nx": arquitetura/adrs/ADR-001-monorepo-nx.md
          - "ADR-002: Frontend em Angular": arquitetura/adrs/ADR-002-frontend-angular.md
          - "ADR-003: Backend em NestJS": arquitetura/adrs/ADR-003-backend-nestjs.md
          - "ADR-004: Firestore & Firebase Auth": arquitetura/adrs/ADR-004-firestore-e-firebase-auth.md
          - "ADR-005: Máquina de Estados": arquitetura/adrs/ADR-005-maquina-de-estados.md
          - "ADR-006: Cadeia de Hash SHA-256": arquitetura/adrs/ADR-006-cadeia-de-hash.md
          - "ADR-007: RBAC e Segregação de Funções": arquitetura/adrs/ADR-007-rbac-e-sod.md
  - "API (OpenAPI)":
      - "Especificação OpenAPI v0.1": api/index.md
  - "Testes e QA":
      - "Estratégia de Testes": testes/estrategia_de_testes.md
  - Governança:
      - "Definition of Done (DoD)": governanca/dod.md
