  /solicitacoes/{id}/trilha:
    get:
      summary: Consultar trilha de auditoria criptográfica
      description: >-
        Retorna os elos da trilha ordenados por sequência. Aprovadores, AUDITOR e ADMIN leem qualquer
        solicitação do tenant; SOLICITANTE só a do próprio pedido. Não existe rota de alteração ou exclusão de elos.
      operationId: obterTrilhaAuditoria
      tags: [Trilha]
      x-implementado: em-revisao
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sequência completa de elos da trilha de auditoria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EloAuditoriaDto'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Solicitante consultando a trilha de pedido de outra pessoa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Solicitação não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /solicitacoes/{id}/trilha/verificar:
    post:
      summary: Verificar integridade criptográfica da trilha
      description: >-
        Recalcula os hashes SHA-256 elo a elo e aponta o primeiro registro quebrado (CA-08.2).
        Para cadeias de até 1.000 elos deve responder em menos de 1 s. Mesmas regras de acesso de GET /trilha.
      operationId: verificarIntegridadeTrilha
      tags: [Trilha]
      x-implementado: em-revisao
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultado da verificação da integridade criptográfica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacaoTrilhaResponseDto'
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso proibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Solicitação não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /solicitacoes/{id}/trilha/exportar:
    get:
      summary: Exportar relatório de auditoria
      description: Exporta os elos completos e selos digitais em formato CSV ou JSON para validação externa independente (RF09 / US-13). Previsto para o Checkpoint 3.
      operationId: exportarTrilha
      tags: [Trilha]
      x-implementado: false
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
            default: json
      responses:
        '200':
          description: Arquivo de conformidade estruturado gerado.
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        '401':
          description: Não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
